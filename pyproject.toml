[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "costgate"
version = "1.0.0rc1"
description = "CI-native cost regression gate for LLM inference"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "costgate contributors" }]

dependencies = [
  "typer>=0.12.3",
  "PyYAML>=6.0.1",
  "numpy>=1.26.0",
  "jsonschema>=4.20.0",
]

[project.optional-dependencies]
openai = [
  "openai>=1.40.0",
  "tiktoken>=0.7.0",
]
test = [
  "pytest>=8.0.0",
]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.8.0",
  "openai>=1.40.0",
  "tiktoken>=0.7.0",
]

[project.scripts]
costgate = "costgate.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["costgate"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
