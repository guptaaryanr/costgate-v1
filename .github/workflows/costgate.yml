name: costgate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  deterministic-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Release check
        run: bash scripts/release_check.sh

      - name: Composite action mock smoke
        uses: ./
        with:
          provider: mock
          model: mock-cheap
          suite-path: benchmarks/costregbench/scenarios/neutral_noop/baseline_suite.yaml
          rate-card-path: benchmarks/costregbench/rate_card.yaml
          provider-config: benchmarks/costregbench/scenarios/neutral_noop/baseline_provider.yaml
          repeats: "2"
          output-dir: .costgate/action-smoke
