version: 1

# v1 policy gates are explicit about metric direction and severity.
gates:
  cost_per_valid_success_usd:
    direction: higher_is_worse
    max_relative_increase: 0.10
    min_absolute_delta_usd: 0.00005
    statistical_test: mann_whitney
    alpha: 0.05
    severity: fail

  task_success_rate:
    direction: lower_is_worse
    min_absolute_value: 0.95
    max_relative_decrease: 0.05
    statistical_test: mann_whitney
    alpha: 0.05
    severity: fail

  p95_latency_ms:
    direction: higher_is_worse
    max_relative_increase: 0.50
    statistical_test: mann_whitney
    alpha: 0.05
    severity: warn

  mean_output_tokens:
    direction: higher_is_worse
    max_relative_increase: 0.25
    statistical_test: mann_whitney
    alpha: 0.05
    severity: warn

  retry_rate:
    direction: higher_is_worse
    max_relative_increase: 0.25
    statistical_test: mann_whitney
    alpha: 0.05
    severity: warn

alpha: 0.05
min_repeats: 5
min_sample_size: 5

variance_aware:
  enabled: true
  k: 3
