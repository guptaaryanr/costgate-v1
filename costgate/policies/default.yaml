version: 1

metrics_to_gate:
  - total_cost_usd
  - cost_per_success_usd
  - p95_latency_ms
  - mean_output_tokens
  - retry_rate

# Default practical threshold: 10%
regression_threshold_pct:
  total_cost_usd: 10
  cost_per_success_usd: 10
  p95_latency_ms: 10
  mean_output_tokens: 10
  retry_rate: 25

# Cost deltas must clear a tiny absolute floor, not cents.
min_absolute_delta_usd: 1.0e-05

alpha: 0.05
min_repeats: 5
min_sample_size: 5

variance_aware:
  enabled: true
  k: 3
